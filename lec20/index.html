<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Flexbox</title>
    <style>
      .container {
        background-color: beige;
        border: 5px solid black;
        margin: 2px;
        padding: 2px;
        display: flex;
        flex-direction: row;
        flex-wrap: wrap;
        height: 1000px;
        justify-content: space-evenly;
        align-items: start;
        align-content: start;
      }
      .box {
        height: 200px;
        width: 200px;
        border: 2px solid brown;
        margin: 2px;
        padding: 2px;
      }
      #box1 {
        background-color: aqua;
        flex-basis: 400px;
        order: 2;
        align-self: center;
      }
      #box2 {
        background-color: blue;
        flex-shrink: 4;
        order: 1;
      }
      #box3 {
        background-color: orange;
        order: 0;
      }
      #box4 {
        background-color: brown;
        order: 1;
        flex-grow: 4;
      }
    </style>
  </head>
  <body>
    <div class="container">
      <div class="box" id="box1">box 1</div>
      <div class="box" id="box2">box 2</div>
      <div class="box" id="box3">box 3</div>
      <div class="box" id="box4">box 4</div>
    </div>
  </body>
</html>
