<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Form-2</title>
  </head>
  <body>
    <form>
      <label for="email">Email ID:</label>
      <input type="text" name="eamil" id="email" /> <br />
      <br />

      <label for="phone">Phone No:</label>
      <input type="tel" name="phone" id="phone" /> <br />
      <br />

      <label for="resume">Resume:</label>
      <input type="file" name="resume" id="resume" /> <br />
      <br />

      <label for="experience">Experience (in years):</label>
      <input type="number" id="experience" min="0" max="30" /> <br />
      <br />

      <fieldset>
        <legend>Skills</legend>
        <label for="html">HTML</label>
        <input type="checkbox" name="html" id="html" />

        <label for="css">CSS</label>
        <input type="checkbox" name="css" id="css" />

        <label for="javascript">JAVASCRIPT</label>
        <input type="checkbox" name="javascript" id="javascript" />
      </fieldset>
      <br />

      <label for="highereducation">Higher Education</label>
      <select name="highereducation" id="highereducation">
        <option value="A">A</option>
        <option value="B">B</option>
        <option value="C">C</option>
      </select>

      <fieldset>
        <legend>Availability</legend>
        <label for="fulltime">Full-Time</label>
        <input type="radio" name="job" id="fulltime" /> <br />
        <label for="parttime">Part-Time</label>
        <input type="radio" name="job" id="parttime" />
      </fieldset>
      <br />

      <label for="additionalcomments">Additional Comments</label> <br />
      <textarea
        name="additionalcomments"
        id="additionalcomments"
        cols="30"
        rows="20"
      ></textarea>
      <br />

      <button>Submit Application</button>
    </form>
  </body>
</html>
