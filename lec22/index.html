<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>CSS Shadow - box & text</title>
    <style>
      :root {
        --primary-color: orange;
      }
      body {
        background-color: gray;
      }
      img {
        height: 100px;
        width: 100px;
      }
      .container {
        height: 650px;
        background-color: black;
        border: 3px solid yellow;
        display: flex;
        justify-content: center;
        align-items: center;
      }
      .box {
        background-color: white;
        width: 330px;
        height: 320px;
        border: 3px solid var(--primary-color);
        margin: 5px;
        padding: 5px;
        /* box-shadow: 10px 10px grey; */
        /* box-shadow: 10px 10px 50px red; */
        /* box-shadow: 15px 15px 90px 25px red; */
        /* box-shadow: inset 10px 10px 70px red; */
        box-shadow: 10px 10px 20px red, 15px 15px 25px 5px var(--primary-color);
      }
      #text {
        text-shadow: 15px 11px 4px red, 17px 17px 5px var(--primary-color);
      }
    </style>
  </head>
  <body>
    <div class="container">
      <div class="box">
        <img src="batman.png" alt="batman" />
        <h2 id="text">Bharat Gogurla</h2>
        <p>
          Lorem ipsum dolor sit amet consectetur adipisicing elit. Modi,
          voluptatibus! Libero, repellendus sequi assumenda, dicta odit amet
          pariatur nemo, temporibus a error doloribus facilis consequuntur.
        </p>
      </div>
    </div>
  </body>
</html>
