<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Position property</title>
    <style>
      * {
        margin: 0px;
        padding: 0px;
      }
      .container {
        position: relative;
        margin: 5px;
        height: 6000px;
        border: solid black 1px;
        background-color: bisque;
      }
      .box {
        height: 2000px;
        background-color: aquamarine;
      }
      img {
        margin: 5px;
      }
      .image2 {
        position: relative;
        top: 100px;
        right: 100px;
      }
      .image3 {
        position: absolute;
        top: 100px;
      }
      .image4 {
        position: sticky;
        top: 10px;
      }
      .image5 {
        position: fixed;
      }
    </style>
  </head>
  <body>
    <div class="container">
      <img
        src="img1.webp"
        alt="image 1"
        width="300px"
        height="300px"
        class="image1"
      />
      <img
        src="img2.jpg"
        alt="image 2"
        width="300px"
        height="300px"
        class="image2"
      />
      <img
        src="img3.jpg"
        alt="image 3"
        width="300px"
        height="300px"
        class="image3"
      />
      <img
        src="img4.webp"
        alt="image 4"
        width="300px"
        height="300px"
        class="image4"
      />
      <img
        src="img5.jpg"
        alt="image 4"
        width="250px"
        height="250px"
        class="image5"
      />
    </div>
    <div class="box"></div>
  </body>
</html>
