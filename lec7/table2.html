<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>table</title>
</head>
<body>
    <table border="1">
        <thead>
            <tr>
                <th>No.</th>
                <th>Full Name</th>
                <th>Position</th>
                <th>Salary</th>
                <th>Type</th>
            </tr>
            <tbody>
                <tr>
                    <td>1</td>
                    <td>bill gates</td>
                    <td>founder microsoft</td>
                    <td>$1000</td>
                    <td rowspan="4">company founder</td>
                </tr>
                <tr>
                    <td>2</td>
                    <td>steve jobs</td>
                    <td>founder apple</td>
                    <td>$1200</td>
                </tr>
                <tr>
                    <td>3</td>
                    <td>larry page</td>
                    <td>founder google</td>
                    <td>$1400</td>
                </tr>
                <tr>
                    <td>4</td>
                    <td>mark zuckerberg</td>
                    <td>founder facebook</td>
                    <td>$1500</td>
                </tr>
                <tfoot>
                    <tr>
                        <td colspan="3">total expense</td>
                        <td>$3000</td>
                    </tr>
                </tfoot>
            </tbody>
        </thead>
    </table>
</body>
</html>
