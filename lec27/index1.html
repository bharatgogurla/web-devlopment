<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Razorpay Card</title>
    <link rel="stylesheet" href="style1.css" />
  </head>
  <body>
    <div class="container">
      <div class="card">
        <img src="icon.jpg" alt="Razorpay" />

        <div class="textBox">
          <h2>Order Summary</h2>

          <p>
            Lorem ipsum dolor sit, amet consectetur adipisicing elit. Labore
            veniam nostrum, cumque temporibus maxime molestiae quae sed
            dignissimos suscipit impedit?
          </p>
        </div>

        <div id="amountBox">
          <div class="leftBox">
            <div class="imgBox">
              <img src="music.png" alt="music" />
            </div>

            <div class="textAmountBox">
              <p>Amount</p>
              <p>$99.9/year</p>
            </div>
          </div>

          <div class="rightBox">
            <a href="#">Change</a>
          </div>
        </div>

        <button id="paymentButton">Proceed to payment</button>

        <div class="cancelBox">
          <a href="#">Cancel Order</a>
        </div>
      </div>
    </div>
  </body>
</html>
