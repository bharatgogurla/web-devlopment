<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Units</title>
    <style>
      * {
        padding: 0px;
        margin: 5px;
      }

      /* percentage */
      .box {
        border: solid red 2px;
        width: 25%;
      }

      .parent {
        border: 1px solid black;
        background-color: beige;
        width: 50%;
      }

      .child {
        border: 1px solid green;
        background-color: aqua;
        width: 20%;
      }

      /* viewport */
      .container {
        background-color: aquamarine;
        border: 2px solid blueviolet;
        height: 100vh;
      }

      /* pixels */
      .box1 {
        border: 1px solid black;
        font-size: 100px;
      }

      /* em  */
      .container {
        font-size: 10px;
      }
      .box2 {
        font-size: 10em;
      }

      /* rem  */
      .box3 {
        border: 1px solid black;
        font-size: 10rem;
      }
    </style>
  </head>
  <body>
    <div class="box">Welcome to bharat gogurla</div>

    <div class="parent">
      <div class="child">CHILD</div>
    </div>

    <div class="container">Welcome to bharat gogurla</div>

    <div class="box1">Bharat gogurla</div>

    <div class="container">
      <div class="box2">Welcome to bharat gogurla</div>
    </div>

    <div class="box3">hello guyzz</div>
  </body>
</html>
