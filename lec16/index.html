<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Display property</title>
    <style>
      * {
        margin: 0px;
        padding: 0px;
      }
      /* box-sizing: border-box */
      .box {
        width: 300px;
        height: 300px;
        border: 1px solid black;
        padding: 100px;
        box-sizing: border-box;
      }
      /* display: inline-block */
      span {
        border: 1px solid black;
        width: 200px;
        height: 100px;
        display: inline-block;
      }
      div {
        border: solid black 3px;
        width: 300px;
        height: 300px;
        margin: 5px;
        padding: 5px;
      }
    </style>
  </head>
  <body>
    <div class="box">Welcome to bharat gogurla</div>

    <span> this is bharat </span>

    <span> this is bharat 2.0</span>

    <div>Welcome to bharat gogurla</div>

    <div>Welcome to web devlopment</div>
  </body>
</html>
